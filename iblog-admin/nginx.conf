# =============================================================
#  登录接口防爆破：按客户端 IP 限速
#
#  limit_req_zone / limit_req_status 必须位于 http 上下文，而 conf.d/*.conf 正是被
#  include 进 http 块的，所以写在文件顶部即可。
#  ⚠️ 改造时注意别把这两行挪进 server{}，否则 nginx 直接起不来。
#
#  rate=10r/m：每个 IP 每分钟 10 次；burst=10 nodelay：允许瞬时突发 10 个请求。
#  正常人手输密码远用不到这个量，而爆破会被压到 1 次/6 秒。
#  注意这是按 $binary_remote_addr 算的 —— 管理后台直接对公网暴露，拿到的就是真实客户端 IP。
# =============================================================
limit_req_zone $binary_remote_addr zone=iblog_login:10m rate=10r/m;
limit_req_status 429;

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # 被限流时返回 JSON，别让前端拿到 nginx 默认的 HTML 错误页
    error_page 429 = @ratelimited;
    location @ratelimited {
        default_type application/json;
        return 429 '{"code":429,"msg":"尝试过于频繁，请稍后再试"}';
    }

    # 登录接口单独限流。用精确匹配（=），nginx 会优先命中它而不是下面的 /api/
    location = /api/admin/auth/login {
        limit_req zone=iblog_login burst=10 nodelay;
        proxy_pass         http://iblog-server:8080/api/admin/auth/login;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 前端路由（history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口，容器间通过服务名互访
    location /api/ {
        proxy_pass         http://iblog-server:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpe?g|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }
}
