# =============================================================
#  iblog 一键部署编排
#  使用：
#    1. cp .env.example .env 并修改密码、密钥
#    2. docker compose up -d --build
#  访问：
#    官网       http://<服务器IP>/
#    管理后台   http://<服务器IP>:81/
#    后端接口   http://<服务器IP>:8080/api
#    接口文档   http://<服务器IP>:8080/swagger-ui.html
#
#  构建有两种模式，由 .env 里的 *_BUILD_CONTEXT / *_DOCKERFILE / DB_INIT_DIR 切换：
#    A) 源码构建（默认）：在服务器上编译 Gradle + pnpm，需要 4G 内存或 2G+Swap
#    B) 本地预构建      ：本机跑 deploy/build-local.sh 产出 deploy/dist/ 后上传，
#                        服务器只做 COPY，几秒完成且几乎不吃内存（2 核 2G 首选）
#  两种模式只需改 .env，不用动本文件。
# =============================================================

name: iblog

services:
  mysql:
    image: mysql:8.0
    container_name: iblog-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-iblog@2026}
      MYSQL_DATABASE: iblog
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --lower_case_table_names=1
      # 小内存优化：默认 buffer pool + performance_schema 在 2G 机器上偏重
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=50
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行这里的 SQL。
      # 源码模式指向 iblog-server 里的脚本（与后端启动自举共用同一份，避免两处维护）；
      # 预构建模式指向 ./dist/db（由 build-local.sh 拷过来）。
      - ${DB_INIT_DIR:-../iblog-server/src/main/resources/db}:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - iblog-net

  redis:
    image: redis:7-alpine
    container_name: iblog-redis
    restart: always
    # maxmemory 给个上限防止 Redis 无节制占用；本站数据量很小（令牌 + 站点配置缓存），128M 远够
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iblog-net

  iblog-server:
    build:
      context: ${SERVER_BUILD_CONTEXT:-../iblog-server}
      dockerfile: ${SERVER_DOCKERFILE:-Dockerfile}
    image: iblog-server:1.0.0
    container_name: iblog-server
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: iblog
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-iblog@2026}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      IBLOG_JWT_SECRET: ${IBLOG_JWT_SECRET:-iblog-personal-blog-jwt-secret-key-please-change-me-2026}
      # 登录令牌有效期（秒），默认 7 天；Cookie maxAge 与 Redis 会话同步使用该值
      IBLOG_JWT_EXPIRE: ${IBLOG_JWT_EXPIRE:-604800}
      # 官网行情登录态 Cookie：线上 HTTPS 必须 Secure；官网与后台为同一主域的不同子域时用 DOMAIN 指定主域
      IBLOG_COOKIE_SECURE: ${IBLOG_COOKIE_SECURE:-true}
      IBLOG_COOKIE_DOMAIN: ${IBLOG_COOKIE_DOMAIN:-}
      # 自动交易总开关（默认关闭；手动模拟买卖不受影响），打开后还需用户在页面二次确认
      IBLOG_PAPER_ENABLED: ${IBLOG_PAPER_ENABLED:-false}
      # 模拟账户初始资金（新建账户或「重置账户」时生效）
      IBLOG_PAPER_INITIAL_CASH: ${IBLOG_PAPER_INITIAL_CASH:-1000000}
      # 额外休市日（逗号分隔 yyyy-MM-dd），引擎据此判断交易日
      IBLOG_PAPER_HOLIDAYS: ${IBLOG_PAPER_HOLIDAYS:-}
      TZ: Asia/Shanghai
      # 小内存机器用 -Xmx384m + SerialGC（比 G1 更省内存）；配置够大时可换回 -Xmx512m -XX:+UseG1GC
      JAVA_OPTS: ${JAVA_OPTS:--Xms128m -Xmx384m -XX:+UseSerialGC}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - iblog-net

  iblog-admin:
    build:
      context: ${ADMIN_BUILD_CONTEXT:-../iblog-admin}
      dockerfile: ${ADMIN_DOCKERFILE:-Dockerfile}
    image: iblog-admin:1.0.0
    container_name: iblog-admin
    restart: always
    depends_on:
      - iblog-server
    ports:
      # 容器内是 443/TLS，对外仍是 81（IP 证书无主机名，无法用 SNI 在同一端口分站点）
      - "${ADMIN_PORT:-81}:443"
    volumes:
      # 证书目录必须**整个**挂进来：live/ 下面全是软链，指向 ../../archive/…，
      # 只挂 live/ 会断链导致 nginx 起不来。只读即可。
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - iblog-net

  iblog-web:
    build:
      context: ${WEB_BUILD_CONTEXT:-../iblog-web}
      dockerfile: ${WEB_DOCKERFILE:-Dockerfile}
    image: iblog-web:1.0.0
    container_name: iblog-web
    restart: always
    depends_on:
      - iblog-server
    ports:
      - "${WEB_PORT:-80}:80"
      - "${WEB_TLS_PORT:-443}:443"
    volumes:
      # Let's Encrypt 的 HTTP-01 校验目录（IP 证书走 webroot 模式，见 DEPLOY.md「三、4」）。
      # 挂到 nginx 的根目录下，certbot 写的校验文件就能被 http://<IP>/.well-known/acme-challenge/<token> 访问到。
      - ./acme/.well-known/acme-challenge:/usr/share/nginx/html/.well-known/acme-challenge:ro
      # 证书目录（同样必须整目录挂，理由见上面 iblog-admin）
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - iblog-net

volumes:
  mysql-data:
  redis-data:

networks:
  iblog-net:
    driver: bridge
