server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 官网是公网开放的，这里**只**放行 /api/portal/。
    # 不要把整个 /api/ 反代出去：那样 /api/admin/**（含登录接口）也会从 80 端口对全网暴露，
    # 管理后台做的 IP 白名单就形同虚设了（本仓库曾有此问题，2026-10-15 修）。
    # 官网前端本来就只调 /api/portal/**，见 src/api/portal.ts，改这里不影响功能。
    location /api/portal/ {
        proxy_pass         http://iblog-server:8080/api/portal/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 其余 /api/**（管理后台接口等）在公网官网上明确 404。
    # 不要让它回落到 location / 的 index.html —— 那样爆破者会拿到一个 200 的 HTML 页面，
    # 既不安全也不利于排查。nginx 取最长前缀匹配，所以 /api/portal/ 优先于 /api/。
    location /api/ {
        return 404;
    }

    location ~* \.(js|css|png|jpe?g|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }
}
