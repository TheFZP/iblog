# =============================================================
#  官网 Nginx（iblog-web）
#   80 端口：**只**服务 ACME HTTP-01 校验文件 + 其余 301 跳 https
#   443 端口：正式站点（TLS）
#
#  证书来自 Let's Encrypt 的「IP 地址证书」，只有 6 天有效期，
#  由 certbot 自动续期 + deploy-hook 重载本容器。详见 DEPLOY.md「三、4」。
#
#  ⚠️ 80 端口不能关、也不能整体跳转：certbot 每 6 天续期都要靠 80 做 HTTP-01 校验。
#     所以下面必须保留一条不被跳转的 /\.well-known/acme-challenge/ 例外。
# =============================================================
server {
    listen       80;
    server_name  _;

    charset utf-8;
    client_max_body_size 10m;

    # ACME HTTP-01 校验：必须走 80 端口且**不能被跳转**，否则 certbot 续期会失败。
    # 用 ^~ 让它优先于下面所有 location，包括结尾那条静态资源正则。
    # 这里用 root 直出文件，文件不存在就 404 —— 不会像以前那样回落到 index.html
    # （回落会返回 200 + HTML，让 ACME 报「内容不对」，反而更难排查）。
    location ^~ /.well-known/acme-challenge/ {
        root         /usr/share/nginx/html;
        default_type text/plain;
        access_log   off;
    }

    # 其余一律跳 https
    location / {
        return 301 https://$host$request_uri;
    }
}

# -------------------------------------------------------------
#  443：正式站点（TLS）
# -------------------------------------------------------------
server {
    listen       443 ssl;
    http2        on;
    server_name  _;

    ssl_certificate     /etc/letsencrypt/live/iblog/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iblog/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL_iblog_web:10m;
    ssl_session_timeout 1d;

    # ⚠️ 特意不开 HSTS。证书只有 6 天有效期，一旦续期失败，HSTS 会把浏览器
    # 钉死在 https 上，用户连「继续访问」都点不了，站点彻底不可达。
    # 等哪天换成 90 天期的域名证书再考虑加 HSTS。

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 官网是公网开放的，这里**只**放行 /api/portal/。
    # 不要把整个 /api/ 反代出去：那样 /api/admin/**（含登录接口）也会从公网暴露，
    # 管理后台做的 IP 白名单就形同虚设了（本仓库曾有此问题，2026-10-15 修）。
    # 官网前端本来就只调 /api/portal/**，见 src/api/portal.ts，改这里不影响功能。
    location /api/portal/ {
        proxy_pass         http://iblog-server:8080/api/portal/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 行情接口：/api/stock/** 同样只读、只暴露行情聚合结果，可以放行。
    # 它必须单独列出来，否则会落到下面 /api/ 的 404 里 —— 股票页上线后
    # 会整个白屏（前端拿不到任何数据），而现象是「页面空着」，很容易被误判成
    # 前端 bug。nginx 取最长前缀匹配，所以本段优先于 /api/。
    # 注意：放行的是前缀 /api/stock/，不是 /api/ —— 管理后台接口仍然 404。
    location /api/stock/ {
        proxy_pass         http://iblog-server:8080/api/stock/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 行情上游（腾讯/同花顺）偶尔慢，超时给得比 portal 宽一些；
        # 但仍要有上限，避免上游卡住时把 nginx 的 worker 连接一起占满。
        proxy_read_timeout 20s;
    }

    # 工具箱接口：/api/tools/** 是公开的（后端 AuthInterceptor 特意跳过这个前缀），
    # 只在前端做限流，不涉及用户数据，可以放行。
    # 上线时漏了这一段，官网访问 /api/tools/weather/* 直接 404 —— 天气卡片空白、
    # AI 建议一直失败。凡是新增公开接口前缀，都要在这里补一条。
    location /api/tools/ {
        proxy_pass         http://iblog-server:8080/api/tools/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 天气 Agent 一次要串行跑 2~3 轮模型 + 上游天气接口，给足时间；
        # 前端 axios 也单独放宽到 60s。
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # 「选股评分」是同步接口：现场拉日 K、行情、资金流再按规则打分，上游慢时
    # 会超过 20s 的通用行情超时。前端 axios 对应单独放宽到 60s。
    location = /api/stock/paper/score {
        proxy_pass         http://iblog-server:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # 「立即重新选股」是同步接口：一轮要现场拉热榜 + 几十只票的日 K/分时/基本面，
    # 正常就要 1~3 分钟，20s 的通用行情超时必然先返回 504（线上踩过：浏览器看到
    # 504，但后端仍在跑完并写入了候选，用户以为失败）。
    # 这里单独给长超时，且不能放宽整个 /api/stock/ —— 那会让普通行情请求卡住时
    # 长时间占用 worker。前端 axios 对应也单独放宽到 180s。
    location = /api/stock/paper/selections/refresh {
        proxy_pass         http://iblog-server:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # AI 对话是长连接流式响应：模型边想边吐，一次对话可能持续一两分钟，
    # 且必须关掉 nginx 缓冲（proxy_buffering off），否则事件会被攒成一批才下发，
    # 前端看到的「打字机效果」就变成了一大段一次性出现。
    # 只在最长前缀匹配里单独放行这一个路径，不影响普通行情请求的超时上限。
    location = /api/stock/ai/chat {
        proxy_pass         http://iblog-server:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 其余 /api/**（管理后台接口等）在官网上一律 404。
    # 不要让它回落到 location / 的 index.html —— 那样爆破者会拿到一个 200 的 HTML 页面，
    # 既不安全也不利于排查。nginx 取最长前缀匹配，所以 /api/portal/ 优先于 /api/。
    location /api/ {
        return 404;
    }

    location ~* \.(js|css|png|jpe?g|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }
}
