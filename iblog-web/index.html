<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)" />
    <title>iblog - 记录技术与生活</title>
    <meta name="description" content="一个用 Spring Boot 3 + Vue3 搭建的个人博客" />

    <!--
      在样式之前同步设好主题，避免「先渲染浅色、再跳深色」的白屏闪烁。
      这段必须内联且不能异步 —— 异步就来不及了。
    -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('iblog-theme')
          var theme =
            saved === 'dark' || saved === 'light'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>

    <!--
      不再外链 Google Fonts：它是渲染阻塞样式表，国内网络访问 fonts.googleapis.com
      会一直挂到连接被重置（ERR_CONNECTION_CLOSED），首屏白白多等好几秒。
      字体统一走系统栈，见 styles/index.css 的 --f-serif / --f-mono。
    -->
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
