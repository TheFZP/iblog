server:
  # 本地用 10730 而不是默认的 8080：本机同时开着多个项目，8080 极易被抢。
  # 主配置文件 application.yml 里仍然是 8080 —— 线上容器内必须监听 8080，
  # 因为前端 nginx 是按服务名 iblog-server:8080 反代的。所以只在 dev profile 覆盖。
  # 需要临时换端口：IBLOG_SERVER_PORT=10731 java -jar ...
  port: ${IBLOG_SERVER_PORT:10730}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本地开发连本地 MySQL。先本地改，确认没问题再同步到线上：
    #     bash deploy/sync-db.sh            # 本地 -> 线上（会先自动备份线上）
    #     bash deploy/sync-db.sh --dry-run  # 只看差异，不写
    #
    # 想把线上数据拉下来覆盖本地：
    #     bash deploy/sync-db.sh --pull
    url: jdbc:mysql://${IBLOG_DB_HOST:localhost}:${IBLOG_DB_PORT:3306}/${IBLOG_DB_NAME:iblog}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${IBLOG_DB_USERNAME:root}
    password: ${IBLOG_DB_PASSWORD:123456}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
  data:
    redis:
      # Redis 只存登录态与站点配置缓存，保持本地：
      # 连线上会让本地登录覆盖线上 token，把浏览器里的线上登录态挤掉。
      host: ${IBLOG_REDIS_HOST:localhost}
      port: ${IBLOG_REDIS_PORT:6379}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

iblog:
  paper:
    # 本地调试：晚上也能手动买卖、跑引擎 tick，避免只能等到 9:30
    force-trading-hours: true
