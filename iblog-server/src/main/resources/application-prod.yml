spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:iblog}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      minimum-idle: 4
      maximum-pool-size: 20
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4

iblog:
  db:
    # 生产环境不动库结构，只做启动自检；建表交给 deploy 里的初始化脚本
    auto-init: false
  jwt:
    secret: ${IBLOG_JWT_SECRET:iblog-personal-blog-jwt-secret-key-please-change-me-2026}
    expire: ${IBLOG_JWT_EXPIRE:86400}
  auth:
    # 线上通过 HTTPS 访问，Cookie 必须 Secure
    cookie-secure: ${IBLOG_COOKIE_SECURE:true}
    # 官网与后台是同一主域的不同子域时，在此填主域（如 example.com），否则留空
    cookie-domain: ${IBLOG_COOKIE_DOMAIN:}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    com.iblog: info
