server:
  # 线上容器内固定 8080：前端 nginx 是按服务名 iblog-server:8080 反代的，
  # Dockerfile 的 EXPOSE 也是 8080，改这里会让线上接口 502。
  # 本地开发的端口在 application-dev.yml 里覆盖（10730），
  # 因为本机同时开着多个项目，8080 是最容易被抢的端口。
  port: 8080
  # 线上 nginx 反代时会把外部的 https 协议、域名写进 X-Forwarded-*。
  # 不识别这些头的话，Spring 看到的仍是内网 http://iblog-server:8080，与浏览器
  # Origin 的 https://<域名> 不同源，连 PATCH 改名这类同源请求都会被 CORS 判成
  # 跨域并拒成 403（"Invalid CORS request"）。
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: iblog-server
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.iblog.module.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

iblog:
  db:
    # 本地开发：库或表不存在时自动建库建表并写入种子数据（生产环境已关闭）
    auto-init: true
  jwt:
    # 生产环境请务必通过环境变量 IBLOG_JWT_SECRET 覆盖（长度需 >= 32 字符）
    secret: iblog-personal-blog-jwt-secret-key-please-change-me-2026
    expire: 86400
    header: Authorization
    prefix: "Bearer "
  auth:
    # 官网行情登录态：后台登录后下发 HttpOnly Cookie，官网据此判断「是否登录过后台」。
    # 同一主机的不同端口（如 https://host:81 与 https://host）浏览器会共享 Cookie。
    cookie-name: ${IBLOG_COOKIE_NAME:iblog_auth}
    # 线上走 HTTPS 必须为 true；本地 http 开发保持 false
    cookie-secure: ${IBLOG_COOKIE_SECURE:false}
    # 留空=仅当前主机；官网与后台是同一主域的不同子域时填主域，如 example.com
    cookie-domain: ${IBLOG_COOKIE_DOMAIN:}
    # 官网与后台变成完全不同的网址时，后台点「行情」签发的一次性票据有效期（秒）
    ticket-expire: ${IBLOG_TICKET_EXPIRE:120}
  paper:
    # 模拟盘自动交易引擎总开关；默认关，人工验证后才在线上打开
    enabled: ${IBLOG_PAPER_ENABLED:false}
    # 开户初始资金
    initial-cash: ${IBLOG_PAPER_INITIAL_CASH:1000000}
    # 引擎 tick 间隔（毫秒）
    tick-ms: ${IBLOG_PAPER_TICK_MS:15000}
    # 选股结果刷新间隔（毫秒）
    selection-refresh-ms: ${IBLOG_PAPER_SELECTION_MS:300000}
    # 佣金费率（0.00025 = 万 2.5）与最低佣金
    commission-rate: ${IBLOG_PAPER_COMMISSION_RATE:0.00025}
    commission-min: ${IBLOG_PAPER_COMMISSION_MIN:5}
    # 印花税（仅卖出）与过户费
    stamp-tax-rate: ${IBLOG_PAPER_STAMP_TAX:0.0005}
    transfer-fee-rate: ${IBLOG_PAPER_TRANSFER_FEE:0.00001}
    # 市价单滑点（基点，1bp = 0.01%）
    slippage-bps: ${IBLOG_PAPER_SLIPPAGE_BPS:5}
    # 风控：单票上限 / 总仓位上限 / 单日亏损熔断 / 每日最多委托数
    max-position-pct: ${IBLOG_PAPER_MAX_POSITION_PCT:0.2}
    max-total-position-pct: ${IBLOG_PAPER_MAX_TOTAL_POSITION_PCT:0.8}
    max-daily-loss-pct: ${IBLOG_PAPER_MAX_DAILY_LOSS_PCT:0.03}
    max-orders-per-day: ${IBLOG_PAPER_MAX_ORDERS:20}
    # 每日最多买入候选数
    max-candidates: ${IBLOG_PAPER_MAX_CANDIDATES:5}
    # 节假日（逗号分隔 yyyy-MM-dd），每年更新；留空只按周末判断
    holiday-dates: ${IBLOG_PAPER_HOLIDAYS:}
    # 本地调试：非交易时段也允许下单/运行引擎
    force-trading-hours: ${IBLOG_PAPER_FORCE_HOURS:false}

logging:
  level:
    com.iblog: info
