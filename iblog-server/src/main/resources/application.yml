server:
  # 线上容器内固定 8080：前端 nginx 是按服务名 iblog-server:8080 反代的，
  # Dockerfile 的 EXPOSE 也是 8080，改这里会让线上接口 502。
  # 本地开发的端口在 application-dev.yml 里覆盖（10730），
  # 因为本机同时开着多个项目，8080 是最容易被抢的端口。
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: iblog-server
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.iblog.module.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

iblog:
  db:
    # 本地开发：库或表不存在时自动建库建表并写入种子数据（生产环境已关闭）
    auto-init: true
  jwt:
    # 生产环境请务必通过环境变量 IBLOG_JWT_SECRET 覆盖（长度需 >= 32 字符）
    secret: iblog-personal-blog-jwt-secret-key-please-change-me-2026
    expire: 86400
    header: Authorization
    prefix: "Bearer "

logging:
  level:
    com.iblog: info
